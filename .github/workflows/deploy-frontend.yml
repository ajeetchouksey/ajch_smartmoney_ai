name: Deploy Frontend to Static Web App

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: false
        default: 'dev'

jobs:
  deploy:
    name: Deploy Static Web App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Inject Container App API URL
        run: |
          API_URL="${{ secrets.CONTAINER_API_URL }}"
          if [ -n "$API_URL" ]; then
            echo "export const AI_API_BASE_URL = '$API_URL';" > src/js/ai/api_config.js
            echo "\u2705 api_config.js written with URL: $API_URL"
          else
            echo "export const AI_API_BASE_URL = '';" > src/js/ai/api_config.js
            echo "\u26a0\ufe0f CONTAINER_API_URL secret not set — AI will be unavailable in production"
          fi
      - name: Deploy to Static Web App
        id: swa-deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "src"
          api_location: ""
          output_location: ""
          skip_app_build: true
          skip_api_build: true
          production_branch: "main"

      - name: Deployment Summary
        run: |
          echo "### Frontend Deployment ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Application URL:** ${{ steps.swa-deploy.outputs.static_web_app_url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ env.DEPLOYMENT_ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
          echo "**Files deployed:** src/" >> $GITHUB_STEP_SUMMARY

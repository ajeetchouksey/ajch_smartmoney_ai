<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartMoney AI</title>
    <!-- Modern Styling: Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Custom modern UIUX Kit styles -->
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-[#f0f2f5] font-sans antialiased text-[#111827] flex h-screen overflow-hidden selection:bg-blue-600/20 selection:text-blue-900">

    <!-- Sidebar / Navigation -->
    <aside class="w-[260px] bg-[#111827] border-r border-[#1f2937] flex flex-col h-full z-20 transition-all duration-300">
        <div class="px-6 py-6 flex items-center">
            <div class="h-8 w-8 rounded-lg bg-blue-600 flex items-center justify-center mr-3 shadow-md shadow-blue-500/20">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" class="text-white">
                    <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <span class="text-lg font-semibold tracking-tight text-white">SmartMoney</span>
        </div>
        
        <div class="px-5 mt-4 mb-2">
            <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Overview</p>
        </div>

        <nav class="flex-1 px-3 py-2 space-y-1 overflow-y-auto" id="nav-menu">
            <!-- Navigation links injected by JS -->
        </nav>
        
        <div class="p-4 mt-auto border-t border-[#1f2937]">
            <button class="flex items-center space-x-3 text-gray-300 hover:bg-[#1f2937] rounded-xl transition-all duration-200 w-full px-3 py-2.5">
                <img class="h-8 w-8 rounded-full border border-gray-600 shadow-sm" src="https://ui-avatars.com/api/?name=Alex&background=3b82f6&color=fff" alt="User avatar">
                <div class="flex flex-col text-left">
                    <span class="font-medium text-sm text-gray-100">Alex Doe</span>
                    <span class="text-xs text-blue-400">Pro Plan</span>
                </div>
            </button>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-full overflow-hidden relative bg-[#f0f2f5]">
        <!-- Header -->
        <header class="bg-white/80 backdrop-blur-md z-10 sticky top-0 px-8 py-4 flex justify-between items-center border-b border-gray-200">
            <h1 class="text-xl font-semibold text-gray-900" id="page-title">Dashboard</h1>
            <div class="flex items-center space-x-4">
                <span id="data-mode-badge"></span>
                <button class="text-gray-500 hover:text-gray-900 transition-colors p-2 rounded-full relative hover:bg-gray-100">
                    <i class="fas fa-bell text-lg"></i>
                    <span class="absolute top-[6px] right-[6px] h-2 w-2 rounded-full bg-rose-500 border-2 border-white"></span>
                </button>
                <div class="h-6 w-px bg-gray-300"></div>
                <button class="bg-[#111827] hover:bg-[#1f2937] text-white font-medium py-2 px-5 rounded-lg transition-all duration-200 text-sm shadow-md shadow-gray-900/10 flex items-center">
                    <i class="fas fa-plus mr-2 opacity-70"></i> New Transaction
                </button>
            </div>
        </header>

        <!-- Dynamic Content Router View -->
        <div id="app-content" class="flex-1 overflow-x-hidden overflow-y-auto px-8 py-8 w-full max-w-7xl mx-auto">
            <!-- Content injected here via UIUX Kit -->
        </div>

    </main>

    <!-- App Logic -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
